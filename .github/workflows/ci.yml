name: Verify

# Full verify runs on macOS because the server's sandbox-gated tests need
# darwin. GitHub-hosted macOS runners are billed at 10x, so a cheap
# ubuntu-latest job below covers typecheck plus the contract and web suites
# (neither has a macOS dependency) on every push/PR, while the macOS job is
# the authoritative full lane.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test (contract, web)
        run: pnpm --filter @writing-studio/contract --filter @writing-studio/web test

  verify:
    runs-on: macos-14
    # Bound runaway runs: macOS minutes are billed at 10x.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify
        run: pnpm verify
        env:
          # Dedicated runner has exclusive CPU, so run the wall-clock layout
          # benchmark that local shared runs skip by default.
          WRITING_STUDIO_PERF: '1'
